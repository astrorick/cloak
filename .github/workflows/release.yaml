name: Release Binaries

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-release:
    name: Build and Upload Binary Archives
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go Environment
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and Compress Binaries
        env:
          CGO_ENABLED: '0'
        run: |
          build_and_package() {
            local GOOS="$1"
            local GOARCH="$2"
            local EXTENSION="$3"
            local BINARY_NAME="cloak${EXTENSION}"
            local ARCHIVE_NAME="cloak-${TAG}-${GOOS}-${GOARCH}.zip"
            local OUTPUT_DIR="${RUNNER_TEMP}/build/${GOOS}-${GOARCH}"

            mkdir -p "${OUTPUT_DIR}"

            echo "Building binary for ${GOOS}-${GOARCH}..."
            GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -ldflags="-s -w" -o "${OUTPUT_DIR}/${BINARY_NAME}" ./cmd/cloak

            echo "Verifying binary for ${GOOS}-${GOARCH}..."
            local BUILT_VERSION
            BUILT_VERSION=$(go version -m "${OUTPUT_DIR}/${BINARY_NAME}" | awk '$1 == "mod" { print $3 }')
            if [ "${BUILT_VERSION}" != "${TAG}" ]; then
              echo "::error::${GOOS}-${GOARCH} binary reports version '${BUILT_VERSION}', expected '${TAG}'"
              exit 1
            fi

            echo "Packaging binary in ${ARCHIVE_NAME}..."
            zip -j "${RUNNER_TEMP}/dist/${ARCHIVE_NAME}" "${OUTPUT_DIR}/${BINARY_NAME}"
          }

          mkdir -p "${RUNNER_TEMP}/dist"

          # Linux
          build_and_package "linux" "amd64" ""
          build_and_package "linux" "arm64" ""

          # Windows
          build_and_package "windows" "amd64" ".exe"

          # MacOS
          build_and_package "darwin" "amd64" ""
          build_and_package "darwin" "arm64" ""

      - name: Generate Checksums
        run: |
          cd "${RUNNER_TEMP}/dist"
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Cloak ${{ env.TAG }}
          files: ${{ runner.temp }}/dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
