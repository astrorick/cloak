name: Release Binaries

on:
  push:
    tags:
      - 'v*' # triggers on any release tag push

jobs:
  build-and-release:
    name: Build and Upload Binary Archives
    runs-on: ubuntu-latest

    permissions:
      contents: write # required to upload release assets

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check Tag Matches App Version
        run: |
          APP_VERSION=$(go run cmd/cloak/main.go version | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
          if [ "${APP_VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match app version ${APP_VERSION} in cmd/cloak/main.go"
            exit 1
          fi

      - name: Build and Compress Binaries
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist

          build_and_package() {
            local GOOS="$1"
            local GOARCH="$2"
            local EXT="$3"
            local BINNAME="cloak${EXT}"
            local ARCHIVE_NAME="cloak-${TAG}-${GOOS}-${GOARCH}.zip"
            local OUTPUT_DIR="build/${GOOS}-${GOARCH}"

            mkdir -p "${OUTPUT_DIR}"

            echo "Building for ${GOOS}-${GOARCH}..."
            GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -ldflags="-s -w" -o "${OUTPUT_DIR}/${BINNAME}" cmd/cloak/main.go

            echo "Packaging ${ARCHIVE_NAME}..."
            zip -j "dist/${ARCHIVE_NAME}" "${OUTPUT_DIR}/${BINNAME}"
          }

          # Linux
          build_and_package "linux" "amd64" ""
          build_and_package "linux" "arm64" ""

          # Windows
          build_and_package "windows" "amd64" ".exe"

          # Mac
          build_and_package "darwin" "amd64" ""
          build_and_package "darwin" "arm64" ""

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Cloak ${{ env.TAG }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
